name: Scrape Single Player

# Manual one-shot job: scrape a single player (matches + extended stats)
# and write directly to Turso.  Useful for forcing a refresh on a player
# whose data appears stale or stuck (e.g. upcoming rows that never resolve).

on:
  workflow_dispatch:
    inputs:
      player_name:
        description: 'Player full name (as stored on tennisabstract)'
        required: true
        default: 'Rafael Jodar'
      tour:
        description: 'Tour'
        required: true
        default: 'atp'
        type: choice
        options:
          - atp
          - wta
      force:
        description: 'Re-scrape even if cache is fresh'
        required: false
        default: 'true'
      sleep:
        description: 'Seconds between requests (politeness)'
        required: false
        default: '2.0'

concurrency:
  group: tennis-single-${{ github.event.inputs.player_name }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt

      - name: Validate Turso secrets
        run: |
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::error::TURSO_DATABASE_URL and TURSO_AUTH_TOKEN secrets must be set"
            exit 1
          fi

      - name: Build single-player file
        run: |
          mkdir -p _tmp
          printf '%s\n' "${{ github.event.inputs.player_name }}" > _tmp/single_player.txt
          echo "--- file content ---"
          cat _tmp/single_player.txt

      - name: Scrape player (${{ github.event.inputs.player_name }})
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            EXTRA="--force"
          fi
          python -m tennis_app.scripts.scrape_extended_top_alumni \
            --cloud \
            --tours "${{ github.event.inputs.tour }}" \
            --max-rank 100000 \
            --sleep "${{ github.event.inputs.sleep || '2.0' }}" \
            --players-file _tmp/single_player.txt \
            $EXTRA
